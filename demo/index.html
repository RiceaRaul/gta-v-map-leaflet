<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA V Map - Web Component Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #fff; }

    #demo-container {
      display: flex;
      height: 100vh;
    }

    #map-wrapper {
      flex: 1;
      background: #1a3a4a;
    }

    gta-v-map {
      display: block;
      width: 100%;
      height: 100%;
    }

    #controls {
      width: 300px;
      padding: 16px;
      background: #222;
      overflow-y: auto;
      border-left: 1px solid #333;
    }

    h2 { margin-bottom: 12px; font-size: 16px; }
    h3 { margin: 16px 0 8px; font-size: 14px; color: #aaa; }

    button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #4a4a4a; }

    #event-log {
      margin-top: 12px;
      padding: 8px;
      background: #111;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
    }
    #event-log div { padding: 2px 0; border-bottom: 1px solid #222; }
  </style>
</head>
<body>
  <div id="demo-container">
    <div id="map-wrapper">
      <gta-v-map
        id="map"
        zoom="3"
        default-style="satellite"
        tile-base-url="/mapStyles"
        blips-url="/blips"
        show-layer-control
        markers='[{"x": 0, "y": 0, "icon": 1, "popup": "Spawn Point"}]'
      ></gta-v-map>
    </div>

    <div id="controls">
      <h2>GTA V Map - Component Demo</h2>

      <h3>Imperative API</h3>
      <button id="btn-add-marker">addMarker() - Random</button>
      <button id="btn-remove-last">removeMarker() - Last Added</button>

      <h3>Property Changes</h3>
      <button id="btn-zoom-in">Zoom In</button>
      <button id="btn-zoom-out">Zoom Out</button>
      <button id="btn-toggle-control">Toggle Layer Control</button>
      <button id="btn-style-satellite">Style: Satellite</button>
      <button id="btn-style-atlas">Style: Atlas</button>
      <button id="btn-style-grid">Style: Grid</button>

      <h3>Events</h3>
      <div id="event-log"></div>
    </div>
  </div>

  <script type="module">
    import '../src/index.ts';

    const map = document.getElementById('map');
    const log = document.getElementById('event-log');
    const addedIds = [];

    function logEvent(name, detail) {
      const entry = document.createElement('div');
      entry.textContent = `${name}: ${JSON.stringify(detail)}`;
      log.prepend(entry);
    }

    // Events
    map.addEventListener('map-ready', () => logEvent('map-ready', {}));
    map.addEventListener('map-click', (e) => logEvent('map-click', e.detail));
    map.addEventListener('marker-click', (e) => logEvent('marker-click', e.detail));

    // Imperative marker API
    document.getElementById('btn-add-marker').addEventListener('click', () => {
      const id = map.addMarker({
        x: (Math.random() - 0.5) * 4000,
        y: (Math.random() - 0.5) * 4000,
        icon: 1,
        popup: `Random marker #${addedIds.length + 1}`,
      });
      addedIds.push(id);
      logEvent('addMarker', { id });
    });

    document.getElementById('btn-remove-last').addEventListener('click', () => {
      const id = addedIds.pop();
      if (id) {
        map.removeMarker(id);
        logEvent('removeMarker', { id });
      }
    });

    // Zoom
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      map.zoom = Math.min(map.zoom + 1, map.maxZoom);
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      map.zoom = Math.max(map.zoom - 1, map.minZoom);
    });

    // Layer control toggle
    document.getElementById('btn-toggle-control').addEventListener('click', () => {
      map.showLayerControl = !map.showLayerControl;
    });

    // Style switching
    document.getElementById('btn-style-satellite').addEventListener('click', () => {
      map.defaultStyle = 'satellite';
    });
    document.getElementById('btn-style-atlas').addEventListener('click', () => {
      map.defaultStyle = 'atlas';
    });
    document.getElementById('btn-style-grid').addEventListener('click', () => {
      map.defaultStyle = 'grid';
    });
  </script>
</body>
</html>
